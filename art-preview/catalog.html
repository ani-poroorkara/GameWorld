<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>MyWorld · Sprite catalog</title><link rel="stylesheet" href="art-preview/preview.css"><style>.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:35px}.sheet{background:#e7e5cd;border:1px solid #d3d5bd;border-radius:7px;overflow:hidden}.sheet header{padding:18px 20px;border-bottom:1px solid #d3d5bd}.sheet h2{font-size:21px}.sheet p{font-size:11px;color:#707b5f;margin:8px 0 0}.sheet canvas{display:block;width:100%;height:auto;image-rendering:pixelated}#catalogStatus{padding-bottom:20px;font-size:12px}@media(max-width:850px){.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.catalog{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="wordmark" href="./">✦ MYWORLD</a><span>ART CATALOG</span><a class="back" href="art-preview/">Approved preview ↗</a></header><main><div class="intro"><div><p class="eyebrow">STYLE B / ALL REGISTERED FRAMES</p><h1>The people & places of MyWorld.</h1><p class="lead">The same images and renderer used by the game. Each pose is shown with its ground anchor.</p></div></div><p id="catalogStatus" role="status">Loading the artwork…</p><div class="catalog" id="catalog"></div><footer class="page-footer"><a href="docs/ART_GUIDE.md">Art & implementation guide ↗</a><a href="docs/ART_PROMPTS.md">Exact generation prompts ↗</a></footer></main><script src="art-manifest.js"></script><script src="art.js"></script><script>
WorldArt.readyPromise.then(()=>{
 const catalog=document.getElementById('catalog');
 for(const [name,source]of Object.entries(ART_MANIFEST.sources)){
  const card=document.createElement('article');card.className='sheet';const header=document.createElement('header'),title=document.createElement('h2'),info=document.createElement('p');title.textContent=name;info.textContent=`${source.cols} × ${source.rows} · ${source.frames.length} frames${Object.keys(source.parts||{}).length?' (includes named parts)':''}`;header.append(title,info);card.append(header);
  const canvas=document.createElement('canvas');canvas.width=source.cols*120;canvas.height=Math.ceil(source.frames.length/source.cols)*138;canvas.setAttribute('aria-label',name+' sprite frames');const g=canvas.getContext('2d');g.imageSmoothingEnabled=false;
  source.frames.forEach((f,i)=>{const x=(i%source.cols)*120+60,y=Math.floor(i/source.cols)*138+116;g.fillStyle='#40543735';g.fillRect(x-38,y+1,76,1);g.fillStyle='#72805e';g.font='9px system-ui';g.textAlign='center';g.fillText(String(i),x,y+15);const h=Math.min(106,100*f.h/f.w);WorldArt.draw(g,name,i,x,y,h);});
  card.append(canvas);catalog.append(card);
 }
 document.getElementById('catalogStatus').textContent=Object.keys(ART_MANIFEST.sources).length+' sources · '+Object.values(ART_MANIFEST.sources).reduce((n,s)=>n+s.frames.length,0)+' frames';
}).catch(()=>document.getElementById('catalogStatus').textContent='Artwork could not load. Open this page through the local server and refresh.');
</script></body></html>
