name: Publish MyWorld to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check the game and prepare static files
        run: |
          node --check access.js
          node access-check.cjs
          node --check game.js
          node --check world-life.js
          node --check encounters.js
          node --check combat-engine.js
          node --check combat-scene.js
          node --check guided-scene.js
          node --check pixel-sprites.js
          node --check map-effects.js
          node --check map-combat.js
          node --check combat.js
          node combat-check.cjs
          node smoke-check.cjs
          node build-pages.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4


